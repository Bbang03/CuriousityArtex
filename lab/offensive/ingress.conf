server {
    listen 80;
    server_tokens off;
    client_max_body_size 5m;
    location / {
        proxy_pass http://crapi-web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
server {
    listen 8025;
    server_tokens off;
    location / {
        proxy_pass http://mailhog:8025;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
    }
}
