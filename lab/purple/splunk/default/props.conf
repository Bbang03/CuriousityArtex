[artex:lab:audit]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 131072
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC

[artex:lab:alert]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 131072
# The alert can fire after the request. Index it at the original audit time so
# ARTEX's bounded execution search can retrieve it; alert_created_at records
# when Splunk actually evaluated and triggered the saved-search action.
TIME_PREFIX = "event_epoch"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 25
TZ = UTC
