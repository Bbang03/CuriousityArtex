# Installed by bootstrap_splunk.py through Splunk's saved-search REST endpoint.
# This template is not in default/: the first schedule begins only after setup.
[artex_lab_crs_match_detection]
search = index="artex_lab" sourcetype="artex:lab:audit" | fields _raw _time | spath | where _time >= ARTEX_ENABLED_SINCE | where matched_rules="true" OR matched_rules=1 | eval detection_match=mvfind('rule_ids{}',"^(1001001|942[0-9]{3})$") | where isnotnull(detection_match) OR match(rule_id,"^(1001001|942[0-9]{3})$") | where isnotnull(id) | eval artex_verification_id=coalesce(artex_verification_id,""), audit_event_id=id, rule_id=coalesce(mvindex('rule_ids{}',detection_match),rule_id,"crs-match"), alert_id="splunk-crs:".id | dedup alert_id | eval alert_payload=json_object("id",alert_id,"event_kind","alert","artex_verification_id",artex_verification_id,"request_uid",request_uid,"audit_event_id",audit_event_id,"timestamp",timestamp,"event_epoch",tonumber(_time),"alert_created_at",strftime(now(),"%Y-%m-%dT%H:%M:%S.%3N%:z"),"target",target,"path",path,"action",action,"rule_id",tostring(rule_id),"rule_ids",mv_to_json_array('rule_ids{}',false()),"detection_rule_id","artex_lab_crs_match_detection","detection_engine","splunk_saved_search","message","Splunk saved search observed native FTP disclosure or SQL injection rule matches") | fields alert_id alert_payload audit_event_id artex_verification_id request_uid _time
description = Actual per-result Splunk alert for native ModSecurity FTP rule 1001001 or CRS SQL injection rules 942xxx in the isolated ARTEX lab.
is_scheduled = 1
cron_schedule = * * * * *
dispatch.earliest_time = -3m
dispatch.latest_time = now
dispatch.max_time = 45
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 0
alert.track = 1
alert.suppress = 1
alert.suppress.fields = alert_id
alert.suppress.period = 10m
alert.expires = 24h
alert.severity = 4
actions = logevent
action.logevent = 1
action.logevent.param.event = $result.alert_payload$
action.logevent.param.index = artex_lab
action.logevent.param.sourcetype = artex:lab:alert
action.logevent.param.source = artex_lab_crs_match_detection
action.logevent.param.host = purple-lab-splunk
disabled = 0
