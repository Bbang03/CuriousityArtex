# Suppress credentials before any disruptive rule can stop request processing.
SecAction "id:1001002,phase:1,pass,nolog,sanitiseRequestHeader:Authorization,sanitiseRequestHeader:Cookie"

# Lab-only protection for the information disclosure reproduced at /ftp.
# This is an explicit local policy; it is not a generic CRS vulnerability rule.
# DetectionOnly logs a match and passes the request. On enforces this deny.
SecRule REQUEST_FILENAME "@rx (?i)^/ftp(?:/|$)" \
    "id:1001001,phase:1,t:none,t:urlDecodeUni,t:normalizePath,deny,status:403,log,auditlog,msg:'ARTEX lab FTP disclosure policy',tag:'artex-lab/ftp-disclosure',severity:'WARNING'"
